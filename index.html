  return new Promise((res,rej)=>{g.on('finished',res);g.on('abort',rej);g.render()});
}
function showGif(blob){
  const url=URL.createObjectURL(blob),file=new File([blob],'odai-photo.gif',{type:'image/gif'});
  const o=document.createElement('div');o.className='help';
  o.innerHTML=`<div class="card"><img class="ph" src="${url}" alt="" style="max-height:none;object-fit:contain"><div class="meta" style="margin:8px 0">写っている人に確認してからシェアしましょう。(${(blob.size/1048576).toFixed(1)}MB)</div><button class="pri" id="gshr">📤 シェア</button><button id="gsv">⬇ GIFを保存</button><button id="hx">閉じる</button></div>`;
  const save=()=>{const a=document.createElement('a');a.href=url;a.download='odai-photo.gif';a.click()};
  o.querySelector('#gshr').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'お題フォト'});else save()}catch(e){}};
  o.querySelector('#gsv').onclick=save;
  o.onclick=e=>{if(e.target===o||e.target.id==='hx'){o.remove();URL.revokeObjectURL(url)}};document.body.appendChild(o)}
const fail=e=>ERR[e&&e.message]||(e&&e.message)||'失敗しました';

const TS_KEY=(window.APP_CONFIG||{}).TS_KEY||''; // サイトキーは config.js に書く(空ならCAPTCHAなし)
function captcha(){return new Promise((res,rej)=>{
  if(!TS_KEY)return res(null);
  app.innerHTML='<div class="card meta">確認中…<div id="cap"></div></div>';
  const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  s.onload=()=>turnstile.render('#cap',{sitekey:TS_KEY,appearance:'interaction-only',callback:t=>res(t),'error-callback':()=>rej(new Error('captcha'))});
  s.onerror=()=>rej(new Error('captcha'));setTimeout(()=>rej(new Error('captcha timeout')),20000);document.head.appendChild(s)})}
async function boot(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const tk=await captcha().catch(()=>null);const r=await sb.auth.signInAnonymously(tk?{options:{captchaToken:tk}}:undefined);if(r.error){app.innerHTML='<div class="card">'+(/captcha/i.test(r.error.message)?'確認(CAPTCHA)に失敗しました。ページを再読み込みしてください。':'接続できませんでした。匿名ログインの設定を確認してください。')+'<br><small>'+esc(r.error.message)+'</small></div>';return}session=r.data.session}
  me=session.user.id;if(roomId)await load();else render(true);
  setInterval(()=>{if(roomId&&!busy)load()},3000);
}
async function load(){
  const [r,p,rd,s]=await Promise.all([
    sb.from('rooms').select('*').eq('id',roomId).maybeSingle(),
    sb.from('players').select('*').eq('room_id',roomId),
    sb.from('rounds').select('*').eq('room_id',roomId).order('no'),
    sb.from('submissions').select('*').eq('room_id',roomId)]);
  if(!r.data){roomId=null;localStorage.removeItem('room');D={};render(true);return}
  const subs=s.data||[],ids=subs.map(x=>x.id);
  const [v,sc]=await Promise.all([ids.length?sb.from('votes').select('*').in('submission_id',ids):{data:[]},sb.from('room_scores').select('*').eq('room_id',roomId)]);
  const need=subs.map(x=>x.image_path).filter(x=>!urls[x]);
  if(need.length){const {data}=await sb.storage.from('photos').createSignedUrls(need,3600);(data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
    let prog=null;const cu0=(rd.data||[])[(rd.data||[]).length-1];
  if(cu0&&cu0.status==='open'){try{const {data}=await sb.rpc('round_progress',{p_round:cu0.id});if(data&&data[0])prog=data[0]}catch(e){}}
  D={room:r.data,players:p.data||[],rounds:rd.data||[],subs,votes:v.data||[],scores:sc.data||[],prog};
  const cu=D.rounds[D.rounds.length-1];let fx=null;
  if(cu){if(seen[cu.id]==='open'&&cu.status==='revealed')fx=cu.id;seen[cu.id]=cu.status}
  render();if(fx)revealFx(fx);
}
function patchVotes(){
  const bs=document.querySelectorAll('.vote button');if(!bs.length)return false;
  bs.forEach(b=>{
    const sid=b.dataset.s,v=+b.dataset.v,vs=D.votes.filter(x=>x.submission_id===sid),y=vs.filter(x=>x.value===1).length,n=vs.length-y,m=(vs.find(x=>x.user_id===me)||{}).value;
    b.textContent=v===1?'👍 納得 '+y:'👎 不満 '+n;
    b.classList.toggle('on',m===v);
  });
  return true;
}
function render(force){
  const {votes,...rest}=D,base=JSON.stringify([rest,msg,roomId]),s=base+JSON.stringify(votes);
  if(!force&&s===sig)return;
  if(!force&&base===sigB&&patchVotes()){sig=s;return}
  sig=s;sigB=base;clearInterval(timer);
  app.innerHTML=(msg?`<div class="toast">${esc(msg)}</div>`:'')+(roomId&&D.room?roomView():home());bind();
}
const picker=()=>`<div class="pick">${AV.map(a=>`<button type="button" class="avb ${a===draft.avatar?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>`;
const nameIn=()=>`<input id="nick" placeholder="ニックネーム(12文字まで)" maxlength="12" value="${esc(draft.nick)}">`;
const home=()=>draft.code?`<h1 class="t in">${LOGO}${HB}</h1><div class="card"><div class="meta">🎉 ルーム <b>${esc(draft.code)}</b> に招待されました</div><b>アバターと名前を決めよう</b>${picker()}${nameIn()}<button class="pri" id="jn"></button><button class="sm" id="other" style="margin:8px 0 0">別のルームを作る/参加する</button></div>`
:`<h1 class="t">${LOGO}${HB}</h1><div class="card"><b>あなたの名前</b>${picker()}${nameIn()}</div><div class="card"><button class="pri" id="mk"></button></div><div class="card"><div class="meta">友達のルームに入る</div><input id="code" placeholder="合言葉(4文字)" maxlength="4" value="" style="text-transform:uppercase"><button class="pri" id="jn"></button></div>`;
const THEMES=window.THEME_LIST||[{name:'おすすめ',items:['今この場でいちばん丸いもの','赤いもの','いちばん驚いた顔','今日を象徴するもの','乾杯の瞬間','ミニチュアに見えるもの']}];
let cat=0,sug=null;
function pick(){const used=new Set((D.rounds||[]).map(r=>r.theme)),all=THEMES[cat].items,pool=all.filter(t=>!used.has(t)),x=(pool.length?pool:all).slice();
  for(let i=x.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[x[i],x[j]]=[x[j],x[i]]}sug=x.slice(0,3)}
const form=label=>{if(!sug)pick();return `<div class="meta" style="margin-top:6px">お題の候補(タップで入力)</div><div>${THEMES.map((c,i)=>`<button type="button" class="cat ${i===cat?'on':''}" data-c="${i}">${esc(c.name)}</button>`).join('')}</div>${sug.map(t=>`<button type="button" class="sg" data-t="${esc(t)}">${esc(t)}</button>`).join('')}<button type="button" id="shuf">🎲 別の候補を出す</button><input id="theme" maxlength="40" placeholder="お題(例: 今この場でいちばん丸いもの)" value="${esc(draft.theme)}">
<select id="secs">${[60,120,180,300].map(n=>`<option value="${n}" ${+draft.secs===n?'selected':''}>制限時間 ${n/60}分</option>`).join('')}</select>
${D.players.length<2?'<div class="meta" style="margin-top:6px">⚠ 2人以上で遊べます。QRコードか合言葉で友達を招待してください</div>':''}<button class="pri" id="go" ${D.players.length<2?'disabled':''}>${label}</button>`};
const totals=name=>[...D.scores].sort((a,b)=>b.total-a.total).map((x,i)=>`<div class="row"><span>${i?i+1+'位':'🏆'} ${ava(x.user_id)} ${esc(x.nickname)}</span><span style="text-align:right"><b>${x.total}</b>点</span></div>`).join('')||'<div class="meta">まだありません</div>';
function roomView(){
  const R=D.room,host=R.host_id===me,cur=D.rounds[D.rounds.length-1];
  const name=id=>(D.players.find(p=>p.user_id===id)||{}).nickname||'?';
  let h=`<h1 class="t">${LOGO}${HB}</h1><div class="meta">ルーム <b>${R.code}</b> ・ ${D.players.length}人<button class="sm" id="sndb">${snd()?'🔊':'🔇'}</button><button class="sm" id="prof">名前・アバターを変更</button><button class="sm" id="leave">退出</button></div>`+(editing?`<div class="card"><b>名前とアバターを変更</b>${picker()}${nameIn()}<button class="pri" id="saveprof">保存</button></div>`:'');
  if(R.status==='finished')return h+`<div class="card"><b>🎉 最終結果</b>${totals()}<button class="pri" id="shrf" style="margin-top:8px">📤 結果をシェア</button></div>`;
  if(!cur){
    h+=`<div class="card"><div class="meta">この合言葉かQRで友達を招待</div><div class="code">${R.code}</div><div id="qr"></div>
    <div>${D.players.map(p=>`<span class="chip">${av(p.avatar)} ${esc(p.nickname)}${p.user_id===me?'(あなた)':''}</span>`).join('')}</div></div>`;
    return h+(host?`<div class="card"><b>最初のお題</b>${form('ラウンド開始')}</div>`:'<div class="card meta">幹事がお題を決めるのを待っています…</div>');
  }
  const mine=D.subs.find(s=>s.round_id===cur.id&&s.user_id===me);
  if(cur.status==='open'){
    h+=`<div class="card"><div class="meta">ラウンド${cur.no} ・ 残り <b id="cd"></b>${D.prog?` ・ <b>${D.prog.answered}/${D.prog.total}人</b>回答済み`:''}</div><div class="theme">${esc(cur.theme)}</div></div>`;
    h+=mine?'<div class="card">✅ 投稿しました。結果発表を待ちましょう!</div>':`<input type="file" id="pic" accept="image/*" capture hidden><button class="pri big" id="shot" ${busy?'disabled':''}>📷 撮って投稿</button>`;
    return h+(host?`<div class="card"><div class="meta">${D.prog?(D.prog.answered>=D.prog.total?'全員が投稿しました!':`あと${D.prog.total-D.prog.answered}人が未投稿です`):'全員が投稿したら公開します'}</div><button class="pri" id="rv">結果を公開する</button></div>`:'');
  }
  const subs=D.subs.filter(s=>s.round_id===cur.id).sort((a,b)=>b.score-a.score);
  const view=(REV&&REV.rid===cur.id)?subs.slice(0,REV.n):subs;
  h+=`<div class="card"><div class="meta">ラウンド${cur.no} 結果発表</div><div class="theme">${esc(cur.theme)}</div></div>`;
  h+=view.map((s,i)=>{
    const vs=D.votes.filter(v=>v.submission_id===s.id),y=vs.filter(v=>v.value===1).length,n=vs.length-y,m=(vs.find(v=>v.user_id===me)||{}).value,own=s.user_id===me;
    return `<div class="card" id="rk${i}"><img class="ph" src="${urls[s.image_path]||''}" alt="">
    <div class="row" style="margin-top:8px"><span><b>${i+1}位</b> ${ava(s.user_id)} ${esc(name(s.user_id))}</span><span class="score" style="text-align:right">${s.score}<small> 点</small></span></div>
    <div class="judge ${Date.now()<fxUntil&&(!REV||i===REV.n-1)?(s.score>=FX.up?'fx-up':s.score<FX.fall?'fx-down':''):''}"><div>${faceImg(s.score)}<div class="meta" style="text-align:center">${esc(CHARA.name)}</div></div><div class="bubble">${esc(s.comment)}</div></div>
    <div class="row vote"><button class="y ${m===1?'on':''}" data-s="${s.id}" data-v="1" ${own?'disabled':''}>👍 納得 ${y}</button><button class="n ${m===-1?'on':''}" data-s="${s.id}" data-v="-1" ${own?'disabled':''}>👎 不満 ${n}</button></div><div style="text-align:right"><button class="sm shr" data-s="${s.id}" data-r="${i+1}">📤 シェア</button></div></div>`}).join('')||'<div class="card meta">投稿がありませんでした</div>';
    if(REV&&REV.rid===cur.id&&!REV.done)return h+'<div class="card meta" style="text-align:center">発表中…</div>';
    if(subs.length)h+='<div class="card"><button id="gifb">🎞 このお題をGIFで保存</button></div>';
  h+=`<div class="card"><b>累計ランキング</b>${totals()}</div>`;
  return h+(host?`<div class="card"><b>次のラウンド</b>${form('次のラウンド開始')}<button id="fin">ゲームを終了する</button></div>`:'<div class="card meta">幹事が次のお題を決めるのを待っています…</div>');
}
async function act(fn,note){
  if(busy)return;
  const had=!!msg;busy=true;msg=note||'';if(note||had)render(true);
  let dim=null;if(note){dim=document.createElement('div');dim.className='dim';dim.innerHTML=`<div><span>🤖</span><div>${esc(note)}</div></div>`;document.body.appendChild(dim)}
  try{await fn();msg=''}catch(e){msg=fail(e)}
  if(dim)dim.remove();
  busy=false;if(roomId)await load();else render(true);
}
const rpc=async(n,a)=>{const {data,error}=await sb.rpc(n,a);if(error)throw error;return data};
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>rej(new Error('画像を読めません'));im.src=URL.createObjectURL(f)})}
function bind(){
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  [['#nick','nick'],['#code','code'],['#theme','theme'],['#secs','secs']].forEach(([s,k])=>{const e=$(s);if(e)e.oninput=e.onchange=()=>{draft[k]=k==='code'?e.value.toUpperCase():e.value;sync()}});
  const cur=D.rounds&&D.rounds[D.rounds.length-1];
  on('#mk',()=>{const n=draft.nick.trim();if(!n)return;localStorage.setItem('nick',n);localStorage.setItem('avatar',draft.avatar);act(async()=>{roomId=await rpc('create_room',{p_nick:n,p_avatar:draft.avatar});localStorage.setItem('room',roomId)})});
  on('#jn',()=>{const n=draft.nick.trim();if(!n||!draft.code)return;localStorage.setItem('nick',n);localStorage.setItem('avatar',draft.avatar);act(async()=>{roomId=await rpc('join_room',{p_code:draft.code,p_nick:n,p_avatar:draft.avatar});localStorage.setItem('room',roomId);draft.code='';history.replaceState(null,'',location.pathname)})});
  on('#other',()=>{draft.code='';render(true)});
  on('#prof',()=>{editing=!editing;render(true)});
  on('#saveprof',()=>{const n=draft.nick.trim();if(!n)return;localStorage.setItem('nick',n);localStorage.setItem('avatar',draft.avatar);act(async()=>{await rpc('update_profile',{p_room:roomId,p_nick:n,p_avatar:draft.avatar});editing=false})});
  document.querySelectorAll('.avb').forEach(b=>b.onclick=()=>{draft.avatar=b.dataset.a;document.querySelectorAll('.avb').forEach(x=>x.classList.toggle('on',x===b))});
  sync();
  on('#help',showRules);
  on('#shrf',async()=>{try{await showShare(cardFinal())}catch(e){msg='画像を作れませんでした';render(true)}});
  on('#gifb',async()=>{
    const btn=$('#gifb'),subs=D.subs.filter(s=>s.round_id===cur.id).sort((a,b)=>b.score-a.score);
    btn.disabled=true;
    try{const blob=await makeGif(subs,(i,n)=>{btn.textContent='作成中… '+i+'/'+n});showGif(blob)}
    catch(e){msg='GIFを作れませんでした';render(true)}
    btn.disabled=false;btn.textContent='🎞 このお題をGIFで保存'});
  document.querySelectorAll('.shr').forEach(b=>b.onclick=async()=>{const s=D.subs.find(x=>x.id===b.dataset.s);if(!s)return;b.disabled=true;b.textContent='作成中…';
    try{await showShare(await cardSub(s,+b.dataset.r))}catch(e){msg='画像を作れませんでした';render(true)}b.disabled=false;b.textContent='📤 シェア'});
  on('#sndb',()=>{localStorage.setItem('snd',snd()?'off':'on');render(true);play('pop')});
  on('#leave',()=>{roomId=null;D={};draft.code='';editing=false;localStorage.removeItem('room');render(true)});
  on('#go',()=>act(async()=>{await rpc('start_round',{p_room:roomId,p_theme:draft.theme,p_seconds:+draft.secs});draft.theme='';sug=null}));
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=+b.dataset.c;pick();render(true)});
  document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{draft.theme=b.dataset.t;const e=$('#theme');if(e)e.value=draft.theme});
  on('#shuf',()=>{pick();render(true)});
  on('#rv',()=>act(()=>rpc('reveal_round',{p_round:cur.id})));
  on('#fin',()=>act(()=>rpc('finish_room',{p_room:roomId})));
  on('#shot',()=>{if(!busy)$('#pic').click()});
  const pic=$('#pic');if(pic)pic.onchange=()=>{const f=pic.files[0];if(!f)return;act(async()=>{
    const b64=await shrink(f);const {error}=await sb.functions.invoke('score',{body:{round_id:cur.id,image_base64:b64}});
    if(error){let m;try{const j=await error.context.json();m=j.error||j.message||j.msg}catch{}throw new Error(m||('送信に失敗しました('+((error.context&&error.context.status)||error.name)+')'))}},'AIが採点中…')};
  document.querySelectorAll('.vote button').forEach(b=>b.onclick=()=>act(async()=>{
    play('pop');const sid=b.dataset.s,v=+b.dataset.v,m=(D.votes.find(x=>x.submission_id===sid&&x.user_id===me)||{}).value;
    const r=m===v?await sb.from('votes').delete().eq('submission_id',sid).eq('user_id',me):await sb.from('votes').upsert({submission_id:sid,user_id:me,value:v},{onConflict:'submission_id,user_id'});
    if(r.error)throw r.error}));
  const qr=$('#qr');if(qr&&window.QRCode)new QRCode(qr,{text:location.origin+location.pathname+'?r='+D.room.code,width:180,height:180});
  const cd=$('#cd');if(cd&&cur){const tick=()=>{const s=Math.round((new Date(cur.ends_at)-Date.now())/1000);cd.textContent=s>0?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'時間切れ'};tick();timer=setInterval(tick,1000)}
}
boot();
