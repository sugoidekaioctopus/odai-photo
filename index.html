<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お題フォト</title>
<style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mut:#6f6a62;--card:#fff;--line:#e6e1d8;--acc:#e8590c;--ok:#2b8a3e;--ng:#c92a2a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--fg:#f2eee8;--mut:#a39d93;--card:#211f1c;--line:#34312c;--acc:#ff8a4c;--ok:#69db7c;--ng:#ff8787}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px;padding-bottom:60px}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 12px;width:100%;box-sizing:border-box;margin:4px 0}
button{cursor:pointer}button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.sm{width:auto;padding:2px 10px;font-size:12px;margin:0 0 0 8px}button:disabled{opacity:.5}
.meta{font-size:13px;color:var(--mut)}.theme{font-size:26px;font-weight:700;color:var(--acc);margin:4px 0}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin:2px;font-size:14px}
.toast{background:var(--acc);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
img.ph{width:100%;border-radius:10px;display:block;max-height:380px;object-fit:cover}
.score{font-size:32px;font-weight:700;color:var(--acc)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.vote button.on.y{background:var(--ok);color:#fff}.vote button.on.n{background:var(--ng);color:#fff}
#qr{display:flex;justify-content:center;margin:10px 0}
.judge{display:flex;gap:10px;align-items:center;margin:8px 0}.judge img,.emo{width:72px;height:72px;object-fit:contain;display:block}.emo{font-size:48px;line-height:72px;text-align:center}.bubble{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex:1}
.big{font-size:20px;padding:16px}.code{font-size:34px;letter-spacing:6px;font-weight:700;text-align:center}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.avb{width:44px;height:44px;padding:0;margin:0;font-size:24px}.avb.on{border-color:var(--acc);background:var(--bg);box-shadow:0 0 0 2px var(--acc)}.av{font-size:20px}img.av{width:24px;height:24px;border-radius:50%;vertical-align:middle;object-fit:cover}
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center}
.drum{font-size:80px;animation:pulse .3s infinite alternate}.big{font-size:28px;font-weight:700;margin-top:8px}
@keyframes pulse{to{transform:scale(1.2) rotate(8deg)}}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-14px)}60%{transform:none}80%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fx-up img,.fx-up .emo{animation:bounce .8s 2}.fx-down img,.fx-down .emo{animation:shake .5s 3}
@media (prefers-reduced-motion:reduce){.fx-up *,.fx-down *,.drum{animation:none!important}}
.cat{width:auto;padding:4px 10px;font-size:13px;margin:2px}.cat.on{background:var(--acc);color:#fff;border-color:var(--acc)}.sg{text-align:left;margin:4px 0}
</style></head><body><main id="app"></main>
<div class="meta" style="text-align:center;padding:0 0 24px">📸 写真はゲーム終了の約1時間後(終了しない場合は12時間後)に自動で削除されます<br>画面の版: 2026-10-24 g</div>
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="themes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CFG=window.SETTINGS||{};
const CH=Object.assign({name:'審査員さん',dir:'chara/',bands:[90,70,50,30]},CFG.chara);
const SN=Object.assign({dir:'sounds/',files:{}},CFG.sounds);
const FX=Object.assign({drumMs:2900,up:70,big:90,sad:50,fall:30},CFG.fx);
const sb=supabase.createClient('https://fcrsgxcmcgkvogjttdar.supabase.co','sb_publishable_qQslyhZGP5kF0OZ_mlGdKg_PKk0c2b4');
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ERR={'room not found':'合言葉の部屋が見つかりません','room full':'この部屋は満員です','host only':'幹事だけができる操作です','round already open':'いまのラウンドを先に公開してください','round closed':'時間切れです','already submitted':'このラウンドは投稿済みです','daily limit':'本日のAI採点の上限に達しました','scoring failed':'採点に失敗しました。もう一度どうぞ','not a member':'ルームに参加していません'};
let me=null,roomId=localStorage.getItem('room'),D={},urls={},sig='',msg='',busy=false,timer=null;
const draft={theme:'',secs:120,code:new URLSearchParams(location.search).get('r')||'',nick:localStorage.getItem('nick')||'',avatar:localStorage.getItem('avatar')||'🙂'};
draft.code=draft.code.toUpperCase();if(draft.code)roomId=null;let editing=false;
const CHARA={name:CH.name},EMO=['😱','😕','😐','🙂','😍'];
const fb=(el,k)=>{if(!el.dataset.t){el.dataset.t=1;el.src=`chara-${k}.png`;return}const s=document.createElement('span');s.className='emo';s.textContent=EMO[k-1];el.replaceWith(s)};
const faceImg=sc=>{const b=CH.bands,k=sc>=b[0]?5:sc>=b[1]?4:sc>=b[2]?3:sc>=b[3]?2:1;return `<img src="${CH.dir}chara-${k}.png" alt="" onerror="fb(this,${k})">`};
const AV=CFG.avatars||['🐱','🐶','🐰','🦊','🐼','🐸','🐵','🦁','🐧','🐙','🦄','🍺','🍕','🎸','🌸','👻'];
const av=a=>a&&a.startsWith('img:')?`<img class="av" src="avatars/${esc(a.slice(4))}.png" alt="">`:`<span class="av">${esc(a||'🙂')}</span>`;
const ava=id=>av((D.players.find(p=>p.user_id===id)||{}).avatar);
const sync=()=>{const n=draft.nick.trim(),j=$('#jn'),m=$('#mk');
  if(j){j.disabled=!n||!draft.code;j.textContent=n?n+'として参加する':'名前を入力してください'}
  if(m){m.disabled=!n;m.textContent=n?'ルームを作る(幹事)':'名前を入力してください'}};
let fxUntil=0;const seen={};
let AC=null;const snd=()=>localStorage.getItem('snd')!=='off';
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
document.addEventListener('pointerdown',()=>ac(),{once:true});
function tone(f,t0,d,type='sine',v=.2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(t0,d,v=.15,hp=800){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter(),t=a.currentTime+t0;f.type='highpass';f.frequency.value=hp;s.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={drum(){let t=0,gap=.16;while(t<FX.drumMs/1000-.1){tone(110,t,.12,'triangle',.25);noise(t,.06,.08,2000);t+=gap;gap=Math.max(.04,gap*.93)}},
 crash(){noise(0,1.2,.25,3000)},fan(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.5,'triangle',.22));tone(1047,.5,.8,'square',.1)},
 sad(){[392,370,349,330].forEach((f,i)=>tone(f,i*.3,.45,'sawtooth',.12))},pop(){tone(660,0,.08,'sine',.2);tone(880,.06,.1,'sine',.2)}};
const BUF={};
async function loadSe(){const a=ac();if(!a)return;for(const[k,f]of Object.entries(SN.files)){try{const r=await fetch(SN.dir+f);if(!r.ok)continue;BUF[k]=await a.decodeAudioData(await r.arrayBuffer())}catch(e){}}}
document.addEventListener('pointerdown',loadSe,{once:true});
const play=n=>{if(!snd())return;const a=ac();if(BUF[n]&&a){const s=a.createBufferSource();s.buffer=BUF[n];s.connect(a.destination);s.start()}else SFX[n]()};
function confetti(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#e8590c','#f59f00','#2b8a3e','#1c7ed6','#d6336c','#7048e8'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,vy:2+Math.random()*4,vx:(Math.random()-.5)*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*6|0]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<240)requestAnimationFrame(loop);else c.remove()})()}
function revealFx(rid){
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div><div class="drum">🥁</div><div class="big">結果発表…</div></div>';document.body.appendChild(o);play('drum');
  setTimeout(()=>{play('crash');o.remove();fxUntil=Date.now()+3000;render(true);
    const best=Math.max(0,...(D.subs||[]).filter(s=>s.round_id===rid).map(s=>s.score));
    if(best>=FX.up){play('fan');confetti(best>=FX.big?220:120)}else if(best<FX.sad)play('sad')},FX.drumMs)}
const fail=e=>ERR[e&&e.message]||(e&&e.message)||'失敗しました';

const TS_KEY=(window.APP_CONFIG||{}).TS_KEY||''; // サイトキーは config.js に書く(空ならCAPTCHAなし)
function captcha(){return new Promise((res,rej)=>{
  if(!TS_KEY)return res(null);
  app.innerHTML='<div class="card meta">確認中…<div id="cap"></div></div>';
  const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  s.onload=()=>turnstile.render('#cap',{sitekey:TS_KEY,appearance:'interaction-only',callback:t=>res(t),'error-callback':()=>rej(new Error('captcha'))});
  s.onerror=()=>rej(new Error('captcha'));setTimeout(()=>rej(new Error('captcha timeout')),20000);document.head.appendChild(s)})}
async function boot(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const tk=await captcha().catch(()=>null);const r=await sb.auth.signInAnonymously(tk?{options:{captchaToken:tk}}:undefined);if(r.error){app.innerHTML='<div class="card">'+(/captcha/i.test(r.error.message)?'確認(CAPTCHA)に失敗しました。ページを再読み込みしてください。':'接続できませんでした。匿名ログインの設定を確認してください。')+'<br><small>'+esc(r.error.message)+'</small></div>';return}session=r.data.session}
  me=session.user.id;if(roomId)await load();else render(true);
  setInterval(()=>{if(roomId&&!busy)load()},3000);
}
async function load(){
  const [r,p,rd,s]=await Promise.all([
    sb.from('rooms').select('*').eq('id',roomId).maybeSingle(),
    sb.from('players').select('*').eq('room_id',roomId),
    sb.from('rounds').select('*').eq('room_id',roomId).order('no'),
    sb.from('submissions').select('*').eq('room_id',roomId)]);
  if(!r.data){roomId=null;localStorage.removeItem('room');D={};render(true);return}
  const subs=s.data||[],ids=subs.map(x=>x.id);
  const [v,sc]=await Promise.all([ids.length?sb.from('votes').select('*').in('submission_id',ids):{data:[]},sb.from('room_scores').select('*').eq('room_id',roomId)]);
  const need=subs.map(x=>x.image_path).filter(x=>!urls[x]);
  if(need.length){const {data}=await sb.storage.from('photos').createSignedUrls(need,3600);(data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
  D={room:r.data,players:p.data||[],rounds:rd.data||[],subs,votes:v.data||[],scores:sc.data||[]};
  const cu=D.rounds[D.rounds.length-1];let fx=null;
  if(cu){if(seen[cu.id]==='open'&&cu.status==='revealed')fx=cu.id;seen[cu.id]=cu.status}
  render();if(fx)revealFx(fx);
}
function render(force){
  const s=JSON.stringify([D,msg,roomId]);if(!force&&s===sig)return;sig=s;clearInterval(timer);
  app.innerHTML=(msg?`<div class="toast">${esc(msg)}</div>`:'')+(roomId&&D.room?roomView():home());bind();
}
const picker=()=>`<div class="pick">${AV.map(a=>`<button type="button" class="avb ${a===draft.avatar?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>`;
const nameIn=()=>`<input id="nick" placeholder="ニックネーム(12文字まで)" maxlength="12" value="${esc(draft.nick)}">`;
const home=()=>draft.code?`<h1>📷 お題フォト</h1><div class="card"><div class="meta">🎉 ルーム <b>${esc(draft.code)}</b> に招待されました</div><b>アバターと名前を決めよう</b>${picker()}${nameIn()}<button class="pri" id="jn"></button><button class="sm" id="other" style="margin:8px 0 0">別のルームを作る/参加する</button></div>`
:`<h1>📷 お題フォト</h1><div class="card"><b>あなたの名前</b>${picker()}${nameIn()}</div><div class="card"><button class="pri" id="mk"></button></div><div class="card"><div class="meta">友達のルームに入る</div><input id="code" placeholder="合言葉(4文字)" maxlength="4" value="" style="text-transform:uppercase"><button class="pri" id="jn"></button></div>`;
const THEMES=window.THEME_LIST||[{name:'おすすめ',items:['今この場でいちばん丸いもの','赤いもの','いちばん驚いた顔','今日を象徴するもの','乾杯の瞬間','ミニチュアに見えるもの']}];
let cat=0,sug=null;
function pick(){const used=new Set((D.rounds||[]).map(r=>r.theme)),all=THEMES[cat].items,pool=all.filter(t=>!used.has(t)),x=(pool.length?pool:all).slice();
  for(let i=x.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[x[i],x[j]]=[x[j],x[i]]}sug=x.slice(0,3)}
const form=label=>{if(!sug)pick();return `<div class="meta" style="margin-top:6px">お題の候補(タップで入力)</div><div>${THEMES.map((c,i)=>`<button type="button" class="cat ${i===cat?'on':''}" data-c="${i}">${esc(c.name)}</button>`).join('')}</div>${sug.map(t=>`<button type="button" class="sg" data-t="${esc(t)}">${esc(t)}</button>`).join('')}<button type="button" id="shuf">🎲 別の候補を出す</button><input id="theme" maxlength="40" placeholder="お題(例: 今この場でいちばん丸いもの)" value="${esc(draft.theme)}">
<select id="secs">${[60,120,180,300].map(n=>`<option value="${n}" ${+draft.secs===n?'selected':''}>制限時間 ${n/60}分</option>`).join('')}</select>
<button class="pri" id="go">${label}</button>`};
const totals=name=>[...D.scores].sort((a,b)=>b.total-a.total).map((x,i)=>`<div class="row"><span>${i?i+1+'位':'🏆'} ${ava(x.user_id)} ${esc(x.nickname)}</span><span style="text-align:right"><b>${x.total}</b>点</span></div>`).join('')||'<div class="meta">まだありません</div>';
function roomView(){
  const R=D.room,host=R.host_id===me,cur=D.rounds[D.rounds.length-1];
  const name=id=>(D.players.find(p=>p.user_id===id)||{}).nickname||'?';
  let h=`<h1>📷 お題フォト</h1><div class="meta">ルーム <b>${R.code}</b> ・ ${D.players.length}人<button class="sm" id="sndb">${snd()?'🔊':'🔇'}</button><button class="sm" id="prof">名前・アバターを変更</button><button class="sm" id="leave">退出</button></div>`+(editing?`<div class="card"><b>名前とアバターを変更</b>${picker()}${nameIn()}<button class="pri" id="saveprof">保存</button></div>`:'');
  if(R.status==='finished')return h+`<div class="card"><b>🎉 最終結果</b>${totals()}</div>`;
  if(!cur){
    h+=`<div class="card"><div class="meta">この合言葉かQRで友達を招待</div><div class="code">${R.code}</div><div id="qr"></div>
    <div>${D.players.map(p=>`<span class="chip">${av(p.avatar)} ${esc(p.nickname)}${p.user_id===me?'(あなた)':''}</span>`).join('')}</div></div>`;
    return h+(host?`<div class="card"><b>最初のお題</b>${form('ラウンド開始')}</div>`:'<div class="card meta">幹事がお題を決めるのを待っています…</div>');
  }
  const mine=D.subs.find(s=>s.round_id===cur.id&&s.user_id===me);
  if(cur.status==='open'){
    h+=`<div class="card"><div class="meta">ラウンド${cur.no} ・ 残り <b id="cd"></b></div><div class="theme">${esc(cur.theme)}</div></div>`;
    h+=mine?'<div class="card">✅ 投稿しました。結果発表を待ちましょう!</div>':`<input type="file" id="pic" accept="image/*" capture hidden><button class="pri big" id="shot">📷 撮って投稿</button>`;
    return h+(host?'<div class="card"><div class="meta">全員が投稿したら公開します</div><button class="pri" id="rv">結果を公開する</button></div>':'');
  }
  const subs=D.subs.filter(s=>s.round_id===cur.id).sort((a,b)=>b.score-a.score);
  h+=`<div class="card"><div class="meta">ラウンド${cur.no} 結果発表</div><div class="theme">${esc(cur.theme)}</div></div>`;
  h+=subs.map((s,i)=>{
    const vs=D.votes.filter(v=>v.submission_id===s.id),y=vs.filter(v=>v.value===1).length,n=vs.length-y,m=(vs.find(v=>v.user_id===me)||{}).value,own=s.user_id===me;
    return `<div class="card"><img class="ph" src="${urls[s.image_path]||''}" alt="">
    <div class="row" style="margin-top:8px"><span><b>${i+1}位</b> ${ava(s.user_id)} ${esc(name(s.user_id))}</span><span class="score" style="text-align:right">${s.score}<small> 点</small></span></div>
    <div class="judge ${Date.now()<fxUntil?(s.score>=FX.up?'fx-up':s.score<FX.fall?'fx-down':''):''}"><div>${faceImg(s.score)}<div class="meta" style="text-align:center">${esc(CHARA.name)}</div></div><div class="bubble">${esc(s.comment)}</div></div>
    <div class="row vote"><button class="y ${m===1?'on':''}" data-s="${s.id}" data-v="1" ${own?'disabled':''}>👍 納得 ${y}</button><button class="n ${m===-1?'on':''}" data-s="${s.id}" data-v="-1" ${own?'disabled':''}>👎 不満 ${n}</button></div></div>`}).join('')||'<div class="card meta">投稿がありませんでした</div>';
  h+=`<div class="card"><b>累計ランキング</b>${totals()}</div>`;
  return h+(host?`<div class="card"><b>次のラウンド</b>${form('次のラウンド開始')}<button id="fin">ゲームを終了する</button></div>`:'<div class="card meta">幹事が次のお題を決めるのを待っています…</div>');
}
async function act(fn,note){
  busy=true;msg=note||'';render(true);
  try{await fn();msg=''}catch(e){msg=fail(e)}
  busy=false;if(roomId)await load();else render(true);
}
const rpc=async(n,a)=>{const {data,error}=await sb.rpc(n,a);if(error)throw error;return data};
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>rej(new Error('画像を読めません'));im.src=URL.createObjectURL(f)})}
function bind(){
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  [['#nick','nick'],['#code','code'],['#theme','theme'],['#secs','secs']].forEach(([s,k])=>{const e=$(s);if(e)e.oninput=e.onchange=()=>{draft[k]=k==='code'?e.value.toUpperCase():e.value;sync()}});
  const cur=D.rounds&&D.rounds[D.rounds.length-1];
  on('#mk',()=>{const n=draft.nick.trim();if(!n)return;localStorage.setItem('nick',n);localStorage.setItem('avatar',draft.avatar);act(async()=>{roomId=await rpc('create_room',{p_nick:n,p_avatar:draft.avatar});localStorage.setItem('room',roomId)})});
  on('#jn',()=>{const n=draft.nick.trim();if(!n||!draft.code)return;localStorage.setItem('nick',n);localStorage.setItem('avatar',draft.avatar);act(async()=>{roomId=await rpc('join_room',{p_code:draft.code,p_nick:n,p_avatar:draft.avatar});localStorage.setItem('room',roomId);draft.code='';history.replaceState(null,'',location.pathname)})});
  on('#other',()=>{draft.code='';render(true)});
  on('#prof',()=>{editing=!editing;render(true)});
  on('#saveprof',()=>{const n=draft.nick.trim();if(!n)return;localStorage.setItem('nick',n);localStorage.setItem('avatar',draft.avatar);act(async()=>{await rpc('update_profile',{p_room:roomId,p_nick:n,p_avatar:draft.avatar});editing=false})});
  document.querySelectorAll('.avb').forEach(b=>b.onclick=()=>{draft.avatar=b.dataset.a;document.querySelectorAll('.avb').forEach(x=>x.classList.toggle('on',x===b))});
  sync();
  on('#sndb',()=>{localStorage.setItem('snd',snd()?'off':'on');render(true);play('pop')});
  on('#leave',()=>{roomId=null;D={};draft.code='';editing=false;localStorage.removeItem('room');render(true)});
  on('#go',()=>act(async()=>{await rpc('start_round',{p_room:roomId,p_theme:draft.theme,p_seconds:+draft.secs});draft.theme='';sug=null}));
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=+b.dataset.c;pick();render(true)});
  document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{draft.theme=b.dataset.t;const e=$('#theme');if(e)e.value=draft.theme});
  on('#shuf',()=>{pick();render(true)});
  on('#rv',()=>act(()=>rpc('reveal_round',{p_round:cur.id})));
  on('#fin',()=>act(()=>rpc('finish_room',{p_room:roomId})));
  on('#shot',()=>$('#pic').click());
  const pic=$('#pic');if(pic)pic.onchange=()=>{const f=pic.files[0];if(!f)return;act(async()=>{
    const b64=await shrink(f);const {error}=await sb.functions.invoke('score',{body:{round_id:cur.id,image_base64:b64}});
    if(error){let m;try{const j=await error.context.json();m=j.error||j.message||j.msg}catch{}throw new Error(m||('送信に失敗しました('+((error.context&&error.context.status)||error.name)+')'))}},'AIが採点中…')};
  document.querySelectorAll('.vote button').forEach(b=>b.onclick=()=>act(async()=>{
    play('pop');const sid=b.dataset.s,v=+b.dataset.v,m=(D.votes.find(x=>x.submission_id===sid&&x.user_id===me)||{}).value;
    const r=m===v?await sb.from('votes').delete().eq('submission_id',sid).eq('user_id',me):await sb.from('votes').upsert({submission_id:sid,user_id:me,value:v},{onConflict:'submission_id,user_id'});
    if(r.error)throw r.error}));
  const qr=$('#qr');if(qr&&window.QRCode)new QRCode(qr,{text:location.origin+location.pathname+'?r='+D.room.code,width:180,height:180});
  const cd=$('#cd');if(cd&&cur){const tick=()=>{const s=Math.round((new Date(cur.ends_at)-Date.now())/1000);cd.textContent=s>0?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'時間切れ'};tick();timer=setInterval(tick,1000)}
}
boot();
</script></body></html>
